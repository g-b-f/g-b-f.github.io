name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install SPA site dependencies
        run: npm ci

      - name: Install blog dependencies
        run: npm --prefix blog ci

      - name: Add LLM directives
        run: npm run directive

      - name: Build SPA site
        run: npm run build:gh

      - name: Build blog
        run: npm --prefix blog run build

      - name: Merge blog build into SPA dist
        run: mv blog/build dist/blog

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5